<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Так-2-Так</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#17202a}
main{max-width:700px;margin:auto;padding:30px 20px;text-align:center}
.logo{font-size:44px;font-weight:800;margin:25px 0 10px}
.subtitle{font-size:20px;line-height:1.5;margin-bottom:30px}
.buttons{display:grid;gap:16px}
button{width:100%;padding:20px;border:0;border-radius:15px;font-size:20px;font-weight:bold;background:#17202a;color:white}
.counter,.trust{margin-top:25px;padding:20px;background:white;border-radius:15px}
.counter{font-size:20px}
.trust{line-height:1.7}
</style>
</head>
<body>
<main>
<div class="logo">Так-2-Так</div>
<div class="subtitle">Глобальне інформаційне бюро нового покоління</div>
<div class="buttons">
<button>ЗАРЕЄСТРУВАТИСЯ</button>
<button>ПРОПОЗИЦІЯ</button>
<button>ПОПИТ</button>
</div>
<div class="counter">👥 Зареєстровані учасники: <strong>0</strong></div>
<div class="trust"><strong>Точність. Перевірені факти. Довіра.</strong><br><br>Точне місце • Точні дані • Чесне порівняння</div>
</main>
</body>
</html>
